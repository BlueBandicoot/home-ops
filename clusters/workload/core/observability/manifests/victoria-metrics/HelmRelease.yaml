---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics
  namespace: observability
spec:
  interval: 1m
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: "0.91.2"
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
        namespace: flux-system
  values:
    victoria-metrics-operator:
      enabled: true
      image:
        tag: v0.70.1 #pinning to 0.70.1 until https://github.com/VictoriaMetrics/operator/issues/2280 is fixed
      admissionWebhooks:
        enabled: false
      crds:
        cleanup:
          enabled: false
      affinity: &affinity
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      operator:
        # Keep prometheus-operator CRDs so existing ServiceMonitors/PodMonitors/PrometheusRules continue working
        disable_prometheus_converter: false
      prometheus-operator-crds:
        enabled: true
    vmsingle:
      enabled: true
      spec:
        retentionPeriod: "15d"
        storage:
          existingClaim: "vmsingle-data"
    vmagent:
      enabled: true
    vmalert:
      enabled: true
    alertmanager:
      enabled: true
    kubeApiServer:
      enabled: true
    kubelet:
      enabled: true
    kubeControllerManager:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeStateMetrics:
      enabled: true
    grafana:
      enabled: false
    kube-state-metrics:
      fullnameOverride: kube-state-metrics
      metricLabelsAllowlist:
        - pods=[*]
        - deployments=[*]
        - persistentvolumeclaims=[*]
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
    nodeExporter:
      enabled: true
    prometheus-node-exporter:
      fullnameOverride: node-exporter
      prometheus:
        monitor:
          enabled: false